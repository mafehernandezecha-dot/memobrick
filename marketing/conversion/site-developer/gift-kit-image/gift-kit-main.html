<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1000px;height:1000px;overflow:hidden;font-family:Inter,sans-serif;color:#15171B;
 background:radial-gradient(120% 80% at 50% 35%,#ffffff 0%,#f6f2ec 55%,#efe8de 100%);position:relative}
.eyebrow{position:absolute;top:58px;left:0;right:0;text-align:center;font:700 17px/1 Inter;letter-spacing:.22em;color:#d6223b}
h1{position:absolute;top:92px;left:0;right:0;text-align:center;font:700 66px/1.02 Fredoka;letter-spacing:-.01em}
h1 span{color:#d6223b}
.badge{position:absolute;top:262px;left:50%;transform:translateX(-50%);background:#15171B;color:#fff;font:600 19px/1 Inter;padding:13px 22px;border-radius:999px}
.floor{position:absolute;left:60px;right:60px;top:765px;height:40px;border-radius:50%;background:radial-gradient(closest-side,rgba(60,40,20,.22),transparent);filter:blur(4px)}
/* the box */
.box{position:absolute;left:70px;top:430px;width:440px;height:342px}
.boximg{position:absolute;left:0;top:0;width:440px;filter:drop-shadow(0 18px 22px rgba(40,30,20,.22))}
.bow{position:absolute;left:263px;top:-74px;width:200px;z-index:5;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.tag{position:absolute;left:250px;top:300px;z-index:6;transform:rotate(-8deg);background:#fff;border-radius:10px;padding:14px 18px 14px 30px;
 box-shadow:0 10px 24px rgba(40,30,20,.18);font:600 20px/1.25 Fredoka;color:#15171B;width:190px}
.tag:before{content:"";position:absolute;left:11px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;border:2px solid #d6223b}
.tag small{display:block;font:600 13px/1.2 Inter;color:#8a8f98;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
/* mosaic */
.frame{position:absolute;left:575px;top:370px;width:330px;height:390px;background:#fff;border-radius:10px;padding:14px;
 box-shadow:0 22px 40px rgba(40,30,20,.20)}
.frame canvas{display:block;width:302px;height:302px;border-radius:3px}
.frame p{text-align:center;font:600 22px/1.2 Fredoka;margin-top:16px}
.frame p span{display:block;font:500 15px/1.3 Inter;color:#6b7079;margin-top:4px}
.arrow{position:absolute;left:505px;top:470px;width:70px}
/* steps */
.steps{position:absolute;left:60px;right:60px;top:860px;display:flex;gap:14px}
.step{flex:1;background:#fff;border-radius:16px;padding:16px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 16px rgba(40,30,20,.08)}
.step b{flex:none;width:38px;height:38px;border-radius:50%;color:#fff;display:grid;place-items:center;font:700 19px Fredoka}
.step span{font:600 17px/1.25 Inter}
.loose{position:absolute}
</style></head><body>

<div class="frame"><canvas id="mos" width="604" height="604"></canvas><p>Their favourite photo<span>turned into a brick mosaic</span></p></div>
<div class="steps">
  <div class="step"><b style="background:#d6223b">1</b><span>You give the Gift Kit</span></div>
  <div class="step"><b style="background:#3b8cf0">2</b><span>They pick their photo</span></div>
  <div class="step"><b style="background:#1f9d63">3</b><span>We ship it to them</span></div>

<script>
function shade(hex,f){var n=parseInt(hex.slice(1),16);return"rgb("+[n>>16,(n>>8)&255,n&255].map(c=>Math.max(0,Math.min(255,Math.round(c*f)))).join(",")+")"}
function brick(ctx,x,y,s,c){ctx.fillStyle=shade(c,1);ctx.fillRect(x+.5,y+.5,s-1,s-1);
 ctx.fillStyle=shade(c,.82);ctx.fillRect(x+.5,y+s-s*.16,s-1,s*.16-.5);
 ctx.beginPath();ctx.arc(x+s/2,y+s/2+s*.05,s*.3,0,7);ctx.fillStyle=shade(c,.8);ctx.fill();
 ctx.beginPath();ctx.arc(x+s/2,y+s/2-s*.02,s*.3,0,7);ctx.fillStyle=shade(c,1.08);ctx.fill();
 ctx.beginPath();ctx.arc(x+s/2-s*.1,y+s/2-s*.12,s*.08,0,7);ctx.fillStyle="rgba(255,255,255,.5)";ctx.fill()}
// bow made of bricks, same as the homepage gift boxes
var B=["...RRR....RRR...","..RSSRR..RRSSR..","..RRSSRRRRSSRR..","....RRRRRRRR...."];
var bc=document.getElementById("bow").getContext("2d"),s=300/16;
B.forEach((r,y)=>{for(var x=0;x<16;x++)if(r[x]!=".")brick(bc,x*s,y*s+150-4*s,s,r[x]=="R"?"#e5304a":"#b81d33")});
// mosaic: soft background with a big question mark in bricks
var N=24,mc=document.getElementById("mos").getContext("2d"),m=604/N;
var Q=["........................","........................","........................",".........XXXXXX.........","........XXXXXXXX........",".......XXX....XXX.......",".......XX......XX.......","...............XX.......","..............XXX.......",".............XXX........","............XXX.........","...........XXX..........","...........XX...........","...........XX...........","........................","........................","...........XX...........","...........XX...........","........................","........................","........................","........................","........................","........................"];
var pal=["#a9e3e8","#bfe9ed","#cdb6f2","#d9c8f6","#f6c6d4","#fbd9e2","#ffe39a"];
for(var y=0;y<N;y++)for(var x=0;x<N;x++){
 var g=(x+y)/(2*N), c=Q[y][x]=="X"?"#15171B":pal[(Math.floor(g*5)+((x*7+y*3)%5==0?1:0))%pal.length];
 brick(mc,x*m,y*m,m,c)}
</script></body></html>
